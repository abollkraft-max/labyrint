<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Labyrint Bot</title>
</head>
<body>
    <h1>Labyrint Bot</h1>
    <button id="startButton">Starta sensorer</button>

    <script>
        const ws = new WebSocket('ws://192.168.0.16:8765');

        ws.onopen = () => {
            console.log("Ansluten till Python-servern!");
        };

        ws.onclose = () => {
            console.log("Anslutningen bröts.");
        };

        ws.onerror = (error) => {
            console.error("WebSocket-fel:", error);
        };

        function handleOrientation(event) {
            const data = {
                alpha: event.alpha,
                beta: event.beta,
                gamma: event.gamma
            };

            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(data));
            }
        }

        const startButton = document.getElementById('startButton');
        if (startButton) {
            startButton.addEventListener('click', () => {
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission()
                        .then(permissionState => {
                            if (permissionState === 'granted') {
                                window.addEventListener('deviceorientation', handleOrientation);
                                console.log("Rörelsesensorer aktiverade!");
                            } else {
                                alert("Behöver tillgång till rörelsesensorer för att funka.");
                            }
                        })
                        .catch(console.error);
                } else {
                    window.addEventListener('deviceorientation', handleOrientation);
                    console.log("Rörelsesensorer lyssnar direkt.");
                }
            });
        }
    </script>
</body>
</html>
